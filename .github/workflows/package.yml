name: Publish NuGet

on:
  push:
    branches:
      - master
    paths:
      - src/**
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version Override (e.g., 1.1.0). Leave blank to use CI numbering.'
        required: false
        type: string

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version_override || format('10.0.0-ci.{0}', github.run_number) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: Login to GitHub NuGet Registry
        run: |
          dotnet nuget add source --username USERNAME \
          --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/the-nexa-group/index.json"

      - name: Build Source Generator
        # The .csproj relies on the generator DLL being in a specific bin path
        run: dotnet build src/Avalonia.Markup.Declarative.SourceGenerator/Avalonia.Markup.Declarative.SourceGenerator.csproj -c Release

      - name: Build Library
        run: dotnet build src/Avalonia.Markup.Declarative/Avalonia.Markup.Declarative.csproj -c Release

      - name: Pack
        # Generates a version like 1.0.0-ci-PR23 or 1.0.0-preview.runID
        run: dotnet pack src/Avalonia.Markup.Declarative/Avalonia.Markup.Declarative.csproj -c Release --include-symbols -p:PackageVersion=${{ env.PACKAGE_VERSION }} -o nupkgs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs
          retention-days: 1

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source github --skip-duplicate