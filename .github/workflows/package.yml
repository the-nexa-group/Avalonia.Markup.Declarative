name: Publish NuGet

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: the-nexa-group/nexa

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: Login to GitHub NuGet Registry
        run: |
          dotnet nuget add source --username USERNAME \
          --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/the-nexa-group/index.json"

      - name: Build Source Generator
        # The .csproj relies on the generator DLL being in a specific bin path
        run: dotnet build src/Avalonia.Markup.Declarative.SourceGenerator/Avalonia.Markup.Declarative.SourceGenerator.csproj -c Release

      - name: Build Library
        run: dotnet build src/Avalonia.Markup.Declarative/Avalonia.Markup.Declarative.csproj -c Release

      - name: Pack
        # Generates a version like 1.0.0-ci-PR23 or 1.0.0-preview.runID
        run: |
          dotnet pack src/Avalonia.Markup.Declarative/Avalonia.Markup.Declarative.csproj \
          -c Release \
          --no-build \
          --include-symbols \
          -p:PackageVersion=1.0.0-ci.${{ github.run_number }} \
          -o ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate